[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "svensemble"
version = "0.4.0"
description = "A toolkit for structural variant ensemble calling"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "pysam",
    "xgboost",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "shap",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests that train models (deselect with '-m \"not slow\"')",
]
addopts = "-m 'not slow'"

[project.scripts]
svensemble = "svensemble.pipeline:main"
benchmark = "svensemble.benchmark:main"