[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "svensemble"
dynamic = ["version"]
description = "A toolkit for structural variant ensemble calling"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "pysam",
    "cyvcf2",
    "igraph",
    "xgboost",
    "pyyaml",
]

[project.optional-dependencies]
shap = ["shap"]
dev = ["pytest", "shap"]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.dynamic]
version = {attr = "svensemble.__version__"}

[tool.pytest.ini_options]
markers = [
    "slow: marks tests that train models (deselect with '-m \"not slow\"')",
]
addopts = "-m 'not slow'"

[project.scripts]
svensemble = "svensemble.cli:main"